<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seat Booking — Samudai Cineplex · Konkani Samudai</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        editorial: ['"Playfair Display"', 'Georgia', 'serif'],
                        sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
                    },
                },
            },
        };
    </script>
    <style>
        html {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            scroll-behavior: smooth;
            background-color: #1e2227;
            color: #f2f0eb;
        }

        h1,
        h2,
        .font-editorial {
            font-family: 'Playfair Display', Georgia, serif;
        }

        .tabular-nums {
            font-variant-numeric: tabular-nums;
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body
    class="bg-[#1E2227] text-[#F2F0EB] antialiased selection:bg-[#C8FF1F]/30 selection:text-[#F2F0EB] min-h-screen flex flex-col">
    <main id="seat-booking-root" class="flex-1 flex items-center justify-center py-6 sm:py-10 px-4 sm:px-6"></main>

    <script>
        (function () {
            const MOVIES = [
                {
                    id: 'konkani-nights',
                    title: 'Konkani Nights',
                    language: 'Konkani',
                    genres: 'Drama, Family',
                    certification: 'U',
                    runtime: '2h 14m',
                    posterUrl: '/src/assets/images/poster_konkani_nights_1795709776908.jpg',
                },
                {
                    id: 'ramayana-hindi',
                    title: 'Ramayana (Hindi)',
                    language: 'Hindi',
                    genres: 'Action, Adventure, Drama',
                    certification: 'UA',
                    runtime: '2h 48m',
                    posterUrl: '/src/assets/images/poster_ramayana_hindi_1795709775896.jpg',
                },
                {
                    id: 'monsoon-run',
                    title: 'Monsoon Run',
                    language: 'Hindi',
                    genres: 'Thriller, Action',
                    certification: 'UA',
                    runtime: '2h 06m',
                    posterUrl: '/src/assets/images/poster_monsoon_run_1795709777300.jpg',
                },
                {
                    id: 'midnight-harbor',
                    title: 'Midnight Harbor',
                    language: 'English',
                    genres: 'Noir, Mystery',
                    certification: 'UA',
                    runtime: '2h 12m',
                    posterUrl: '/src/assets/images/poster_midnight_harbor_1795707113166.jpg',
                },
                {
                    id: 'glass-orchard',
                    title: 'The Glass Orchard',
                    language: 'Hindi',
                    genres: 'Drama, Mystery',
                    certification: 'U',
                    runtime: '2h 08m',
                    posterUrl: '/src/assets/images/poster_glass_orchard_1795707114740.jpg',
                },
                {
                    id: 'solaris-drift',
                    title: 'Solaris Drift',
                    language: 'English',
                    genres: 'Sci-Fi, Adventure',
                    certification: 'UA',
                    runtime: '2h 28m',
                    posterUrl: '/src/assets/images/poster_solaris_drift_1795707112834.jpg',
                },
            ];

            const SHOWTIME_DATES = [
                { date: '2026-11-27', label: '27 Nov' },
                { date: '2026-11-28', label: '28 Nov' },
                { date: '2026-11-29', label: '29 Nov' },
            ];

            const SCHEDULE_TEMPLATE = [
                { movieId: 'konkani-nights', auditorium: 'Samudai Cineplex, Margao · Screen 1', format: '2K Laser', times: ['10:15 am', '02:30 pm', '06:45 pm'] },
                { movieId: 'ramayana-hindi', auditorium: 'Samudai Cineplex, Margao · Screen 1', format: 'Dolby Atmos', times: ['12:45 pm', '04:30 pm', '08:45 pm'] },
                { movieId: 'monsoon-run', auditorium: 'Samudai Cineplex, Margao · Screen 2', format: '2K Laser', times: ['11:30 am', '03:45 pm', '09:15 pm'] },
                { movieId: 'midnight-harbor', auditorium: 'Samudai Cineplex, Margao · Screen 2', format: '35mm Archival', times: ['01:15 pm', '05:30 pm', '09:45 pm'] },
                { movieId: 'glass-orchard', auditorium: 'Samudai Cineplex, Margao · Screen 1', format: '2K Laser', times: ['11:00 am', '03:00 pm', '07:15 pm'] },
                { movieId: 'solaris-drift', auditorium: 'Samudai Cineplex, Margao · Screen 2', format: 'Dolby Atmos', times: ['12:00 pm', '04:15 pm', '08:30 pm'] },
            ];

            const ALL_SHOWTIMES = SHOWTIME_DATES.flatMap((d) =>
                SCHEDULE_TEMPLATE.flatMap((tpl) =>
                    tpl.times.map((time) => ({
                        id: `${tpl.movieId}-${d.date}-${time.replace(/[:\s]/g, '')}`,
                        movieId: tpl.movieId,
                        date: d.date,
                        dateLabel: d.label,
                        time,
                        auditoriumName: tpl.auditorium,
                        format: tpl.format,
                    }))
                )
            );

            const SEAT_ROWS = [
                { row: '1', label: 'Stalls Standard', base: 600, cols: 12 },
                { row: '2', label: 'Stalls Standard', base: 600, cols: 14 },
                { row: '3', label: 'Stalls Standard', base: 600, cols: 14 },
                { row: '4', label: 'Stalls Standard', base: 600, cols: 14 },
                { row: '5', label: 'Dress Circle', base: 750, cols: 14 },
                { row: '6', label: 'Dress Circle', base: 750, cols: 16 },
                { row: '7', label: 'Dress Circle', base: 750, cols: 16 },
                { row: '8', label: 'Samudai Balcony', base: 950, cols: 16 },
                { row: '9', label: 'Samudai Balcony', base: 950, cols: 16 },
                { row: '10', label: 'Samudai Balcony', base: 950, cols: 14 },
            ];

            const SEEDED_OCCUPIED = {
                'konkani-nights-2026-11-27-1015am': [
                    '1-3', '1-4', '1-9', '1-10',
                    '2-5', '2-6', '2-11',
                    '3-2', '3-3', '3-8', '3-9', '3-12',
                    '4-4', '4-7', '4-8', '4-13',
                    '5-3', '5-4', '5-11', '5-12',
                    '6-2', '6-13', '6-14',
                    '7-5', '7-6', '7-11', '7-12',
                    '8-4', '8-5', '8-12', '8-13',
                    '9-3', '9-8', '9-9', '9-14',
                    '10-5', '10-6', '10-10',
                ],
                'ramayana-hindi-2026-11-27-1245pm': ['2-6', '2-7', '5-7', '5-8', '6-7', '6-8', '6-9', '8-6', '8-7'],
                'monsoon-run-2026-11-27-1130am': ['3-5', '3-6', '6-6', '6-7', '7-8', '7-9'],
            };

            const CONCESSIONS = [
                { id: 'solkadhi-glass', name: 'Chilled Kokum Solkadhi', price: 90 },
                { id: 'cashew-fudge', name: 'Goan Cashew Caramel Popcorn', price: 180 },
                { id: 'prawn-rissois', name: 'Warm Prawn Rissois (4 pcs)', price: 220 },
                { id: 'bebinca-slice', name: 'Seven-Layer Bebinca', price: 160 },
            ];

            const state = {
                movieId: 'konkani-nights',
                showtimeId: 'konkani-nights-2026-11-27-1015am',
                step: 'seats', // 'seats' | 'payment' | 'ticket'
                selectedSeats: ['6-7', '6-8', '6-9', '6-10'],
                concessions: {},
                isMember: false,
                customerName: '',
                customerEmail: '',
                upiId: '',
                bookingCode: null,
                bookedSeatsByShowtime: {},
            };

            function esc(str) {
                return String(str ?? '')
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
            }

            function ordinalSuffix(num) {
                const n = Number(num);
                const mod100 = n % 100;
                if (mod100 >= 11 && mod100 <= 13) return 'th';
                switch (n % 10) {
                    case 1: return 'st';
                    case 2: return 'nd';
                    case 3: return 'rd';
                    default: return 'th';
                }
            }

            function getOccupiedSet(showtimeId) {
                const seeded = SEEDED_OCCUPIED[showtimeId] || ['3-5', '3-6', '6-7', '6-8', '8-6', '8-7'];
                const extra = state.bookedSeatsByShowtime[showtimeId] || [];
                return new Set([...seeded, ...extra]);
            }

            function getSeatPriceMap(format) {
                const surcharge = format === 'Dolby Atmos' ? 50 : 0;
                const map = {};
                SEAT_ROWS.forEach((r) => {
                    for (let n = 1; n <= r.cols; n++) {
                        map[`${r.row}-${n}`] = r.base + surcharge;
                    }
                });
                return map;
            }

            function render() {
                const root = document.getElementById('seat-booking-root');
                const movie = MOVIES.find((m) => m.id === state.movieId) || MOVIES[0];
                const showtime = ALL_SHOWTIMES.find((s) => s.id === state.showtimeId) || ALL_SHOWTIMES[0];
                const siblingShowtimes = ALL_SHOWTIMES.filter((s) => s.movieId === movie.id && s.date === showtime.date);
                const occupied = getOccupiedSet(showtime.id);
                const seatPrices = getSeatPriceMap(showtime.format);

                const ticketsTotal = state.selectedSeats.reduce((sum, id) => sum + (seatPrices[id] || 600), 0);
                const snacksTotal = CONCESSIONS.reduce((sum, c) => sum + c.price * (state.concessions[c.id] || 0), 0);
                const subtotal = ticketsTotal + snacksTotal;
                const discount = state.isMember ? Math.round(subtotal * 0.2) : 0;
                const total = Math.max(0, subtotal - discount);

                const dateParts = showtime.dateLabel.split(' ');
                const dateDay = dateParts[0] || '27';
                const dateMonth = (dateParts[1] || 'NOV').toUpperCase();
                const screenShort = showtime.auditoriumName.includes('Screen 2') ? 'Screen 2' : 'Screen 1';

                root.innerHTML = `
            <div class="w-full max-w-[1040px] space-y-4">
              <!-- Compact Film & Member Preview Bar above the Card -->
              <div class="flex flex-wrap items-center justify-between gap-3 px-1">
                <div class="flex flex-wrap items-center gap-1.5">
                  ${MOVIES.map(
                    (m) => `<button type="button" data-pick-movie="${m.id}" class="px-3 py-1.5 rounded-full text-[11px] font-medium transition-colors cursor-pointer ${m.id === movie.id
                            ? 'bg-[#C8FF1F] text-[#1E2227] font-semibold'
                            : 'bg-[#252A30] text-[#B5AFA6] border border-[#B5AFA6]/20 hover:text-[#F2F0EB]'
                        }">${esc(m.title)}</button>`
                ).join('')}
                </div>
                <button type="button" id="toggle-member-rate" class="px-3 py-1.5 rounded-full text-[11px] font-mono font-semibold border transition-colors cursor-pointer ${state.isMember
                        ? 'bg-[#C8FF1F]/15 border-[#C8FF1F] text-[#C8FF1F]'
                        : 'bg-[#252A30] border-[#B5AFA6]/25 text-[#B5AFA6] hover:text-[#F2F0EB]'
                    }">
                  ${state.isMember ? 'Samudai Card: 20% Off Active' : 'Apply Samudai Card (20% Off)'}
                </button>
              </div>

              <!-- MAIN SEAT BOOKING FRAME -->
              <div class="rounded-[24px] bg-[#16191D] border border-[#B5AFA6]/18 overflow-hidden shadow-[0_28px_70px_rgba(0,0,0,0.65)]">
                <!-- TOP ATMOSPHERIC BACKDROP -->
                <div class="relative h-44 sm:h-52 bg-[#16191D] overflow-hidden">
                  <img src="${esc(movie.posterUrl)}" alt="${esc(movie.title)}" class="absolute inset-0 w-full h-full object-cover object-center opacity-40 scale-105" />
                  <div class="absolute inset-0 bg-gradient-to-t from-[#16191D] via-[#16191D]/60 to-[#1E2227]/65"></div>
                  <div class="absolute inset-0 bg-gradient-to-r from-[#16191D]/90 via-[#16191D]/35 to-[#16191D]/80"></div>

                  <div class="relative z-10 flex items-center justify-between px-5 sm:px-8 pt-5">
                    <a href="/konkani-samudai.html" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-[#1E2227]/80 backdrop-blur-md border border-[#B5AFA6]/20 text-[11px] font-medium text-[#B5AFA6] hover:text-[#C8FF1F] hover:border-[#C8FF1F]/50 transition-colors">
                      <span>←</span><span>Konkani Samudai</span>
                    </a>
                    <span class="font-mono text-[11px] text-[#B5AFA6]/80">${esc(showtime.auditoriumName)}</span>
                  </div>
                </div>

                <!-- MAIN BODY OVERLAPPING THE BACKDROP -->
                <div class="relative z-10 px-5 sm:px-8 pb-8 -mt-28 sm:-mt-32 grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                  <!-- LEFT RAIL: PORTRAIT POSTER + STACKED SEAT ROWS + TOTAL + CANCEL / NEXT -->
                  <div class="lg:col-span-4 space-y-5">
                    <div class="w-44 sm:w-52 lg:w-full max-w-[250px] mx-auto lg:mx-0 aspect-[2/3] rounded-lg overflow-hidden bg-[#252A30] border border-[#B5AFA6]/20 shadow-[0_24px_50px_rgba(0,0,0,0.85)]">
                      <img src="${esc(movie.posterUrl)}" alt="${esc(movie.title)}" class="w-full h-full object-cover" />
                    </div>

                    ${state.step !== 'ticket'
                        ? `<div class="space-y-2.5 max-w-[250px] mx-auto lg:mx-0 w-full">
                            ${state.selectedSeats.length === 0
                            ? `<div class="rounded border border-dashed border-[#B5AFA6]/25 bg-[#1E2227]/45 px-4 py-4 text-center text-xs text-[#B5AFA6]">
                                    Select seats from the chart.
                                  </div>`
                            : `<div class="space-y-2">
                                    ${state.selectedSeats
                                .map((id) => {
                                    const [row, num] = id.split('-');
                                    const price = seatPrices[id] || 600;
                                    return `
                                          <div class="flex items-center justify-between gap-2 px-3.5 py-2.5 rounded-[4px] border border-[#B5AFA6]/25 bg-[#16191D]/95 text-[#F2F0EB]">
                                            <div class="flex items-baseline gap-1.5">
                                              <span class="font-mono text-[17px] font-bold text-[#F2F0EB] leading-none tabular-nums">${row}</span>
                                              <span class="text-[11px] text-[#B5AFA6]">row</span>
                                              <span class="font-mono text-[17px] font-bold text-[#F2F0EB] leading-none ml-2 tabular-nums">${num}<sup class="text-[10px] font-normal text-[#B5AFA6] ml-0.5">${ordinalSuffix(num)}</sup></span>
                                              <span class="text-[11px] text-[#B5AFA6]">seat</span>
                                            </div>
                                            <div class="flex items-center gap-2.5">
                                              <span class="font-mono text-xs text-[#B5AFA6] tabular-nums">₹${price}</span>
                                              ${state.step === 'seats'
                                            ? `<button type="button" data-toggle-seat="${id}" aria-label="Remove seat ${row} row ${num}" class="text-[#B5AFA6]/80 hover:text-[#C8FF1F] text-sm leading-none transition-colors cursor-pointer">×</button>`
                                            : ''
                                        }
                                            </div>
                                          </div>`;
                                })
                                .join('')}
                                  </div>`
                        }

                            ${snacksTotal > 0
                            ? `<div class="rounded-[4px] border border-[#B5AFA6]/20 bg-[#1E2227]/60 px-3 py-2 space-y-1 text-[11px]">
                                    <p class="font-semibold text-[#C8FF1F] uppercase tracking-wider text-[10px]">Samudai Kitchen</p>
                                    ${CONCESSIONS.filter((c) => (state.concessions[c.id] || 0) > 0)
                                .map(
                                    (c) => `
                                      <div class="flex justify-between text-[#B5AFA6]">
                                        <span class="truncate pr-2">${state.concessions[c.id]}× ${esc(c.name)}</span>
                                        <span class="font-mono text-[#F2F0EB] tabular-nums">₹${c.price * state.concessions[c.id]}</span>
                                      </div>`
                                )
                                .join('')}
                                  </div>`
                            : ''
                        }

                            ${discount > 0
                            ? `<div class="flex items-center justify-between text-[11px] text-[#C8FF1F] px-0.5 pt-0.5">
                                    <span>Samudai Member (20% Off)</span>
                                    <span class="font-mono tabular-nums">-₹${discount}</span>
                                  </div>`
                            : ''
                        }

                            <div class="flex items-baseline justify-end gap-2.5 pt-2">
                              <span class="text-xs text-[#B5AFA6]">Total:</span>
                              <span class="font-mono text-[22px] font-bold text-[#F2F0EB] leading-none tabular-nums">₹${total}</span>
                            </div>

                            ${state.step === 'seats'
                            ? `<div class="grid grid-cols-2 gap-3 pt-2">
                                    <button type="button" id="cancel-seats-btn" class="py-2.5 rounded-[4px] border border-[#C8FF1F]/70 text-[#C8FF1F] hover:bg-[#C8FF1F]/10 text-[11px] font-semibold uppercase tracking-wider transition-colors cursor-pointer">Cancel</button>
                                    <button type="button" id="next-step-btn" ${state.selectedSeats.length === 0 ? 'disabled' : ''} class="py-2.5 rounded-[4px] bg-[#C8FF1F] text-[#1E2227] hover:bg-[#B5AFA6] disabled:opacity-35 disabled:cursor-not-allowed text-[11px] font-bold uppercase tracking-wider transition-colors cursor-pointer">Next</button>
                                  </div>`
                            : `<div class="grid grid-cols-2 gap-3 pt-2">
                                    <button type="button" id="back-step-btn" class="py-2.5 rounded-[4px] border border-[#B5AFA6]/40 text-[#F2F0EB] hover:border-[#C8FF1F] hover:text-[#C8FF1F] text-[11px] font-semibold uppercase tracking-wider transition-colors cursor-pointer">Edit Seats</button>
                                    <button type="button" id="cancel-seats-btn" class="py-2.5 rounded-[4px] border border-[#C8FF1F]/70 text-[#C8FF1F] hover:bg-[#C8FF1F]/10 text-[11px] font-semibold uppercase tracking-wider transition-colors cursor-pointer">Cancel</button>
                                  </div>`
                        }
                          </div>`
                        : `<div class="max-w-[250px] mx-auto lg:mx-0 rounded-lg border border-[#C8FF1F]/40 bg-[#1E2227] p-4 space-y-1.5 text-xs">
                            <p class="font-mono text-[10px] uppercase tracking-widest text-[#C8FF1F]">Pass Issued</p>
                            <p class="font-mono text-lg font-bold text-[#F2F0EB] tabular-nums">${esc(state.bookingCode)}</p>
                            <p class="text-[#B5AFA6]">Present at ${esc(screenShort)} entrance.</p>
                          </div>`
                    }
                  </div>

                  <!-- RIGHT 8 COLS: TITLE + 3-STEP TABS + AUDITORIUM STAGE & METADATA RAIL -->
                  <div class="lg:col-span-8 pt-2 sm:pt-11 space-y-7">
                    <!-- UPPERCASE TITLE -->
                    <div>
                      <h1 class="font-editorial text-3xl sm:text-[40px] font-bold uppercase tracking-wide text-[#F2F0EB] leading-none">
                        ${esc(movie.title)}
                      </h1>
                    </div>

                    <!-- 3-STEP HORIZONTAL PROGRESS BAR -->
                    <div class="grid grid-cols-3 border-b border-[#B5AFA6]/15 text-[11px] font-semibold uppercase tracking-wider">
                      <button type="button" ${state.step === 'payment' ? 'id="back-step-btn"' : ''} class="pb-3 flex items-center gap-2 border-b-2 text-left transition-colors ${state.step === 'seats'
                        ? 'border-[#C8FF1F] text-[#F2F0EB]'
                        : state.step === 'payment'
                            ? 'border-transparent text-[#B5AFA6] hover:text-[#F2F0EB] cursor-pointer'
                            : 'border-transparent text-[#B5AFA6]/60'
                    }">
                        <span class="w-4 h-4 rounded-[3px] font-mono text-[10px] font-bold flex items-center justify-center shrink-0 ${state.step === 'seats' ? 'bg-[#C8FF1F] text-[#1E2227]' : 'bg-[#252A30] text-[#B5AFA6]'
                    }">1</span>
                        <span class="truncate">Choose Your Place</span>
                      </button>

                      <div class="pb-3 flex items-center justify-center gap-2 border-b-2 ${state.step === 'payment' ? 'border-[#C8FF1F] text-[#F2F0EB]' : 'border-transparent text-[#B5AFA6]/55'
                    }">
                        <span class="w-4 h-4 rounded-[3px] font-mono text-[10px] font-bold flex items-center justify-center shrink-0 ${state.step === 'payment' ? 'bg-[#C8FF1F] text-[#1E2227]' : 'bg-[#252A30] text-[#B5AFA6]'
                    }">2</span>
                        <span>Payment</span>
                      </div>

                      <div class="pb-3 flex items-center justify-end gap-2 border-b-2 ${state.step === 'ticket' ? 'border-[#C8FF1F] text-[#F2F0EB]' : 'border-transparent text-[#B5AFA6]/55'
                    }">
                        <span class="w-4 h-4 rounded-[3px] font-mono text-[10px] font-bold flex items-center justify-center shrink-0 ${state.step === 'ticket' ? 'bg-[#C8FF1F] text-[#1E2227]' : 'bg-[#252A30] text-[#B5AFA6]'
                    }">3</span>
                        <span>Ticket</span>
                      </div>
                    </div>

                    <!-- CENTER STAGE + RIGHT DATE / TIME / TYPE RAIL -->
                    <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-start">
                      <div class="md:col-span-9">
                        ${state.step === 'seats'
                        ? `<div class="space-y-6">
                                <!-- Perspective Trapezoid Screen + Glow Beam -->
                                <div class="flex flex-col items-center pt-1">
                                  <div class="w-full max-w-[360px] h-10 bg-gradient-to-b from-[#B5AFA6]/75 to-[#B5AFA6]/55" style="clip-path: polygon(0 0, 100% 0, 91% 100%, 9% 100%);"></div>
                                  <div class="w-full max-w-[360px] h-8 bg-gradient-to-b from-[#B5AFA6]/22 to-transparent" style="clip-path: polygon(9% 0, 91% 0, 100% 100%, 0 100%);"></div>
                                </div>

                                <!-- Tapered Square Seat Chart Matching Reference Proportions -->
                                <div class="overflow-x-auto pb-1">
                                  <div class="min-w-[360px] flex flex-col items-center space-y-[6px]">
                                    ${SEAT_ROWS.map((r, rIdx) => {
                            const sectionBreak = rIdx === 6 ? 'pt-3' : '';
                            const extraBottomGap = rIdx === 9 ? 'pt-1' : '';
                            return `
                                        <div class="flex items-center justify-center gap-[6px] ${sectionBreak} ${extraBottomGap}">
                                          ${Array.from({ length: r.cols }, (_, i) => {
                                const n = i + 1;
                                const id = `${r.row}-${n}`;
                                const isOcc = occupied.has(id);
                                const isSel = state.selectedSeats.includes(id);
                                const balconyAisle =
                                    rIdx === 9 && (n === 2 || n === 5 || n === 8 || n === 11) ? 'mr-2.5' : '';
                                return `<button
                                              type="button"
                                              ${isOcc ? 'disabled' : ''}
                                              data-toggle-seat="${id}"
                                              title="Row ${r.row} · Seat ${n} (${r.label} · ₹${r.base + (showtime.format === 'Dolby Atmos' ? 50 : 0)})"
                                              class="${balconyAisle} w-[18px] h-[18px] sm:w-[20px] sm:h-[20px] rounded-[2px] transition-all duration-150 ${isOcc
                                        ? 'bg-[#21252B] border border-[#2C3138]/60 cursor-not-allowed opacity-70'
                                        : isSel
                                            ? 'bg-[#C8FF1F] shadow-[0_0_10px_rgba(200,255,31,0.55)] cursor-pointer'
                                            : 'bg-[#5A5F66] hover:bg-[#B5AFA6] cursor-pointer'
                                    }"
                                            ></button>`;
                            }).join('')}
                                        </div>`;
                        }).join('')}
                                  </div>
                                </div>

                                <!-- Compact Legend -->
                                <div class="flex flex-wrap items-center justify-center gap-5 pt-2 text-[11px] text-[#B5AFA6]">
                                  <span class="inline-flex items-center gap-2"><span class="w-3 h-3 rounded-[2px] bg-[#5A5F66]"></span>Available</span>
                                  <span class="inline-flex items-center gap-2"><span class="w-3 h-3 rounded-[2px] bg-[#C8FF1F]"></span>Selected</span>
                                  <span class="inline-flex items-center gap-2"><span class="w-3 h-3 rounded-[2px] bg-[#21252B] border border-[#2C3138]"></span>Occupied</span>
                                </div>

                                <!-- Optional Samudai Kitchen Snacks Collapsible -->
                                <details class="rounded-xl border border-[#B5AFA6]/15 bg-[#1E2227]/55 px-4 py-2.5 text-xs">
                                  <summary class="cursor-pointer font-medium text-[#B5AFA6] hover:text-[#C8FF1F] transition-colors flex items-center justify-between">
                                    <span>Add Samudai Kitchen snacks &amp; solkadhi (optional)</span>
                                    <span class="font-mono text-[#C8FF1F]">+ Add</span>
                                  </summary>
                                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pt-3">
                                    ${CONCESSIONS.map((c) => {
                            const qty = state.concessions[c.id] || 0;
                            return `
                                        <div class="p-2.5 rounded-lg bg-[#16191D] border border-[#B5AFA6]/15 flex items-center justify-between gap-2">
                                          <div>
                                            <p class="font-medium text-[#F2F0EB]">${esc(c.name)}</p>
                                            <p class="font-mono text-[11px] text-[#C8FF1F] tabular-nums">₹${c.price}</p>
                                          </div>
                                          <div class="flex items-center gap-1.5">
                                            <button type="button" data-conc-delta="${c.id}:-1" class="w-6 h-6 rounded bg-[#252A30] text-[#F2F0EB] font-mono cursor-pointer">-</button>
                                            <span class="w-5 text-center font-mono tabular-nums">${qty}</span>
                                            <button type="button" data-conc-delta="${c.id}:1" class="w-6 h-6 rounded bg-[#252A30] text-[#F2F0EB] hover:bg-[#C8FF1F] hover:text-[#1E2227] font-mono cursor-pointer">+</button>
                                          </div>
                                        </div>`;
                        }).join('')}
                                  </div>
                                </details>
                              </div>`
                        : state.step === 'payment'
                            ? `<form id="payment-form" class="rounded-2xl bg-[#1E2227] border border-[#B5AFA6]/20 p-5 sm:p-6 space-y-4">
                                <div>
                                  <p class="font-mono text-[11px] uppercase tracking-wider text-[#C8FF1F]">Step 2 · YouPI &amp; Card</p>
                                  <h2 class="font-editorial text-2xl font-semibold text-[#F2F0EB] mt-0.5">Complete your reservation</h2>
                                </div>
                                <div class="space-y-3">
                                  <input name="customerName" required placeholder="Full Name (e.g. Sunita Naik)" value="${esc(state.customerName)}" class="w-full px-3.5 py-2.5 rounded-xl bg-[#16191D] border border-[#B5AFA6]/20 text-xs text-[#F2F0EB] placeholder:text-[#B5AFA6]/60 focus:outline-none focus:border-[#C8FF1F]" />
                                  <input name="customerEmail" type="email" required placeholder="Email Address" value="${esc(state.customerEmail)}" class="w-full px-3.5 py-2.5 rounded-xl bg-[#16191D] border border-[#B5AFA6]/20 text-xs text-[#F2F0EB] placeholder:text-[#B5AFA6]/60 focus:outline-none focus:border-[#C8FF1F]" />
                                  <input name="upiId" required placeholder="YouPI / UPI ID (e.g. sunita@youpi)" value="${esc(state.upiId)}" class="w-full px-3.5 py-2.5 rounded-xl bg-[#16191D] border border-[#B5AFA6]/20 font-mono text-xs text-[#F2F0EB] placeholder:text-[#B5AFA6]/60 focus:outline-none focus:border-[#C8FF1F]" />
                                </div>
                                <button type="submit" class="w-full py-3 rounded-xl bg-[#C8FF1F] text-[#1E2227] hover:bg-[#B5AFA6] text-xs font-bold uppercase tracking-wider transition-colors cursor-pointer">
                                  Pay ₹${total} via YouPI &amp; Issue Ticket
                                </button>
                              </form>`
                            : `<div class="rounded-2xl bg-[#B5AFA6] text-[#1E2227] p-6 space-y-4">
                                <div class="flex items-center justify-between">
                                  <span class="px-2.5 py-1 rounded-full bg-[#1E2227] text-[#C8FF1F] font-mono text-[11px] font-bold">CONFIRMED PASS</span>
                                  <span class="font-mono text-sm font-bold">${esc(state.bookingCode)}</span>
                                </div>
                                <div>
                                  <h2 class="font-editorial text-2xl font-semibold">${esc(movie.title)}</h2>
                                  <p class="text-xs text-[#2C3138] mt-1">${showtime.dateLabel} · ${showtime.time} · ${esc(showtime.auditoriumName)}</p>
                                  <p class="font-mono text-xs font-bold mt-2">
                                    Seats: ${state.selectedSeats.map((id) => `Row ${id.replace('-', ' Seat ')}`).join(' · ')}
                                  </p>
                                  <p class="font-mono text-xs mt-1">Paid via YouPI: ₹${total}</p>
                                </div>
                                <div class="pt-2">
                                  <button type="button" id="reset-booking-btn" class="px-5 py-2.5 rounded-xl bg-[#1E2227] text-[#C8FF1F] text-xs font-semibold cursor-pointer">Book another seat selection</button>
                                </div>
                              </div>`
                    }
                      </div>

                      <!-- RIGHT METADATA RAIL -->
                      <aside class="md:col-span-3 flex md:flex-col items-center justify-between md:justify-start gap-7 text-center pt-1">
                        <div class="space-y-1.5">
                          <p class="text-[11px] text-[#B5AFA6]">Date:</p>
                          <div class="w-[74px] h-[74px] rounded-[4px] border border-[#B5AFA6]/25 bg-[#16191D] flex flex-col items-center justify-center">
                            <span class="font-mono text-[26px] font-bold text-[#F2F0EB] leading-none tabular-nums">${dateDay}</span>
                            <span class="font-mono text-[11px] uppercase tracking-widest text-[#B5AFA6] mt-1">${dateMonth}</span>
                          </div>
                        </div>

                        <div class="space-y-1.5">
                          <p class="text-[11px] text-[#B5AFA6]">Time:</p>
                          <p class="font-mono text-sm font-bold text-[#F2F0EB] tabular-nums">${showtime.time}</p>
                          ${state.step === 'seats' && siblingShowtimes.length > 1
                        ? `<div class="flex md:flex-col gap-1 pt-1">
                                  ${siblingShowtimes
                            .filter((s) => s.id !== showtime.id)
                            .map(
                                (alt) => `<button type="button" data-pick-showtime="${alt.id}" class="px-2 py-0.5 rounded bg-[#1E2227] border border-[#B5AFA6]/20 hover:border-[#C8FF1F] font-mono text-[10px] text-[#B5AFA6] hover:text-[#C8FF1F] tabular-nums transition-colors cursor-pointer">${alt.time}</button>`
                            )
                            .join('')}
                                </div>`
                        : ''
                    }
                        </div>

                        <div class="space-y-1">
                          <p class="text-[11px] text-[#B5AFA6]">Type:</p>
                          <p class="font-mono text-xs font-bold uppercase tracking-wide text-[#F2F0EB]">${esc(showtime.format)}</p>
                          <p class="text-[10px] text-[#B5AFA6]/75">${esc(screenShort)}</p>
                        </div>
                      </aside>
                    </div>
                  </div>
                </div>
              </div>
            </div>`;
            }

            document.addEventListener('click', (e) => {
                const movieBtn = e.target.closest('[data-pick-movie]');
                if (movieBtn) {
                    const id = movieBtn.getAttribute('data-pick-movie');
                    const firstShow = ALL_SHOWTIMES.find((s) => s.movieId === id && s.date === '2026-11-27') || ALL_SHOWTIMES[0];
                    state.movieId = id;
                    state.showtimeId = firstShow.id;
                    state.step = 'seats';
                    state.selectedSeats = ['6-7', '6-8'];
                    render();
                    return;
                }

                const showBtn = e.target.closest('[data-pick-showtime]');
                if (showBtn) {
                    state.showtimeId = showBtn.getAttribute('data-pick-showtime');
                    state.selectedSeats = [];
                    render();
                    return;
                }

                if (e.target.closest('#toggle-member-rate')) {
                    state.isMember = !state.isMember;
                    render();
                    return;
                }

                const seatBtn = e.target.closest('[data-toggle-seat]');
                if (seatBtn) {
                    const id = seatBtn.getAttribute('data-toggle-seat');
                    if (state.selectedSeats.includes(id)) {
                        state.selectedSeats = state.selectedSeats.filter((s) => s !== id);
                    } else if (state.selectedSeats.length < 8) {
                        state.selectedSeats.push(id);
                    }
                    render();
                    return;
                }

                const concBtn = e.target.closest('[data-conc-delta]');
                if (concBtn) {
                    const [id, delta] = concBtn.getAttribute('data-conc-delta').split(':');
                    state.concessions[id] = Math.max(0, Math.min(10, (state.concessions[id] || 0) + Number(delta)));
                    render();
                    return;
                }

                if (e.target.closest('#cancel-seats-btn')) {
                    state.selectedSeats = [];
                    state.concessions = {};
                    state.step = 'seats';
                    render();
                    return;
                }

                if (e.target.closest('#next-step-btn')) {
                    if (state.selectedSeats.length > 0) {
                        state.step = 'payment';
                        render();
                    }
                    return;
                }

                if (e.target.closest('#back-step-btn')) {
                    state.step = 'seats';
                    render();
                    return;
                }

                if (e.target.closest('#reset-booking-btn')) {
                    state.selectedSeats = [];
                    state.concessions = {};
                    state.step = 'seats';
                    state.bookingCode = null;
                    render();
                    return;
                }
            });

            document.addEventListener('submit', (e) => {
                if (e.target.id === 'payment-form') {
                    e.preventDefault();
                    const fd = new FormData(e.target);
                    state.customerName = String(fd.get('customerName') || '');
                    state.customerEmail = String(fd.get('customerEmail') || '');
                    state.upiId = String(fd.get('upiId') || '');
                    state.bookingCode = `KS-${Math.floor(1000 + Math.random() * 8999)}`;
                    const existing = state.bookedSeatsByShowtime[state.showtimeId] || [];
                    state.bookedSeatsByShowtime[state.showtimeId] = [...existing, ...state.selectedSeats];
                    state.step = 'ticket';
                    render();
                }
            });

            render();
        })();
    </script>
</body>

</html>
