    <!-- PC LEFT SIDEBAR (Razorpay 2-Column Exact Layout for Desktop) -->
    <aside class="ypg-pc-sidebar">
      <div>
        <!-- Merchant Brand Header -->
        <div class="ypg-pc-brand-header">
          <div class="ypg-pc-avatar" id="pcMerchantAvatarBox">
            <span id="pcMerchantAvatarLetter">M</span>
            <img id="pcMerchantAvatarImg" alt="Logo" style="display:none;" />
          </div>
          <div class="ypg-pc-brand-info">
            <div class="ypg-pc-merchant-name" id="pcMerchantName">{{MERCHANT_NAME}}</div>
            <div class="ypg-pc-trust-badge" id="pcTrustBadge">
              <svg class="ypg-pc-green-shield" viewBox="0 0 24 24" fill="none">
                <path d="M12 2L3 6v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V6l-9-4z" fill="#10b981" />
                <path d="M8.5 12l2.5 2.5 5-5" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
              <span id="pcTrustBadgeText">YouPI PG Trusted Business</span>
            </div>
          </div>
        </div>

        <!-- Social Proof Banner -->
        <div class="ypg-pc-social-proof" id="pcSocialProofWrap">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="21" r="1" />
            <circle cx="20" cy="21" r="1" />
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
          </svg>
          <span id="pcSocialProofText">500+ orders last month from {{MERCHANT_NAME}}</span>
        </div>

        <!-- Price Summary Card (STRICTLY NO UPI ID VISIBLE) -->
        <div class="ypg-pc-price-card">
          <div class="ypg-pc-price-label">Price Summary</div>
          <div class="ypg-pc-price-val" id="pcPriceSummaryAmount">₹{{AMOUNT}}</div>
        </div>

        <!-- User Identity Row -->
        <div class="ypg-pc-row-btn" id="pcCustomerProfileRow" onclick="toggleAccountMenu(event)">
          <div class="ypg-pc-row-left">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            <span id="pcCustomerProfileText">Using as Guest User</span>
          </div>
          <span class="ypg-pc-chevron">&rsaquo;</span>
        </div>
      </div>

      <!-- Bottom cinema graphic (reel + admission ticket) -->
      <div style="margin-top:auto;">
        <div class="ypg-pc-bags-wrap">
          <svg viewBox="0 0 260 160" width="220" height="135" fill="none" aria-hidden="true">
            <ellipse cx="130" cy="146" rx="98" ry="11" fill="rgba(0,0,0,0.22)" />

            <!-- Film reel -->
            <g transform="translate(62 78) rotate(-14)">
              <circle r="36" fill="#C8FF1F" />
              <circle r="11" fill="#15181C" />
              <circle cy="-22" r="7.5" fill="#15181C" />
              <circle cx="21" cy="-7" r="7.5" fill="#15181C" />
              <circle cx="13" cy="18" r="7.5" fill="#15181C" />
              <circle cx="-13" cy="18" r="7.5" fill="#15181C" />
              <circle cx="-21" cy="-7" r="7.5" fill="#15181C" />
            </g>

            <!-- Admission ticket -->
            <g transform="translate(110 68) rotate(7)">
              <rect width="120" height="68" rx="11" fill="#252A30" stroke="#C8FF1F" stroke-width="2" />
              <path d="M80 0 v68" stroke="#C8FF1F" stroke-dasharray="3 4" opacity="0.5" />
              <circle cx="0" cy="34" r="7" fill="#14181B" />
              <circle cx="120" cy="34" r="7" fill="#14181B" />
              <text x="40" y="27" fill="#C8FF1F" font-family="Arial, sans-serif" font-size="8" font-weight="700" letter-spacing="1.6" text-anchor="middle">ADMIT ONE</text>
              <text x="40" y="43" fill="#F2F0EB" font-family="Arial, sans-serif" font-size="7" letter-spacing="1.1" text-anchor="middle">KONKANI SAMUDAI</text>
              <text x="40" y="56" fill="#B5AFA6" font-family="Arial, sans-serif" font-size="6" letter-spacing="1" text-anchor="middle">CINEMA · MARGAO</text>
            </g>
          </svg>
        </div>
      </div>
    </aside>
