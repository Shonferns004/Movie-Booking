<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Theater Seat Builder</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>🎭 Theater Seat Builder</h1>
      <div class="token-box">
        <input id="adminToken" type="password" placeholder="Admin token" />
        <button id="saveTokenBtn" class="btn">Set Token</button>
      </div>
    </header>

    <main>
      <!-- 1. Theatres -->
      <section class="card">
        <h2>Theatres</h2>
        <div class="row">
          <input id="theatreName" placeholder="Theatre name" />
          <input id="theatreAddress" placeholder="Address" />
          <button id="addTheatreBtn" class="btn primary">+ Add Theatre</button>
        </div>
        <div id="theatreList" class="theatre-list"></div>
      </section>

      <!-- 2. Auditoriums -->
      <section class="card" id="auditoriumSection" style="display:none;">
        <h2 id="auditoriumTitle">Auditoriums</h2>
        <div class="row">
          <input id="auditoriumName" placeholder="Auditorium / screen name" />
          <button id="addAuditoriumBtn" class="btn primary">+ Add Auditorium</button>
        </div>
        <div id="auditoriumList" class="theatre-list"></div>
      </section>

      <!-- 3. Seat builder -->
      <section class="card" id="builderSection" style="display:none;">
        <h2 id="builderTitle">Seat Layout Builder</h2>
        <div class="row">
          <label>Rows: <input id="rowsInput" type="number" value="10" min="1" max="30" /></label>
          <label>Cols: <input id="colsInput" type="number" value="12" min="1" max="40" /></label>
          <button id="buildGridBtn" class="btn">Build Grid</button>
          <button id="saveLayoutBtn" class="btn primary">Save Layout</button>
          <button id="closeBuilderBtn" class="btn">Close</button>
        </div>

        <div class="row" style="margin-bottom:10px;">
          <label>Paint tool:
            <select id="paintTool">
              <option value="cycle">Cycle (click to next type)</option>
              <option value="standard">Standard</option>
              <option value="premium">Premium</option>
              <option value="recliner">Recliner</option>
              <option value="wheelchair">Wheelchair</option>
              <option value="gap">Gap</option>
              <option value="disabled">Disabled</option>
              <option value="empty">Empty</option>
            </select>
          </label>
          <button id="fillRowBtn" class="btn">Fill current row</button>
          <button id="fillAllBtn" class="btn">Fill all seats</button>
          <label>Aisle at col:
            <input id="aisleCol" type="number" min="1" value="6" style="width:60px;" />
          </label>
          <button id="insertAisleBtn" class="btn">Insert aisle column</button>
          <button id="removeAisleBtn" class="btn">Remove aisle column</button>
          <label>Aisle at row:
            <input id="aisleRow" type="number" min="1" value="6" style="width:60px;" />
          </label>
          <button id="insertAisleRowBtn" class="btn">Insert aisle row</button>
          <button id="removeAisleRowBtn" class="btn">Remove aisle row</button>
          <label>Numbering mode:
            <select id="numberingMode">
              <option value="compact">Compact (skip gaps: 1,2,3)</option>
              <option value="fixed">Fixed by column (1,-,3,4)</option>
            </select>
          </label>
          <label>Direction:
            <select id="numberingDir">
              <option value="ltr">Left → Right</option>
              <option value="rtl">Right → Left</option>
            </select>
          </label>
          <label><input type="checkbox" id="useRowLetters" /> Use row letters (A, B, C…)</label>
          <button id="applyRowLettersBtn" class="btn">Apply A, B, C… to rows</button>
          <span class="hint">Tip: double-click a seat to edit its number/label.</span>
        </div>

        <div class="legend">
          <span class="legend-item"><span class="seat standard"></span> Standard</span>
          <span class="legend-item"><span class="seat premium"></span> Premium</span>
          <span class="legend-item"><span class="seat recliner"></span> Recliner</span>
          <span class="legend-item"><span class="seat wheelchair"></span> Wheelchair</span>
          <span class="legend-item"><span class="seat gap"></span> Gap</span>
          <span class="legend-item"><span class="seat disabled"></span> Disabled</span>
          <span class="legend-item"><span class="seat empty"></span> Empty</span>
        </div>

        <div class="screen-bar">SCREEN</div>
        <div id="gridContainer" class="grid-container"></div>
        <p id="builderHint" class="hint">Click a seat to cycle its type.</p>
      </section>
    </main>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
